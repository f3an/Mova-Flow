name: Release

# The host role only runs on Windows (whisper-cli.exe, PowerShell Expand-Archive,
# nvidia-smi — see docs/ARCHITECTURE.md#platform-constraints); the macOS build is
# client-role only (UI + networking, no local recognition). GitHub also attaches
# an automatic "Source code (zip)" asset to every release — nothing to build for that.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: mova-flow-windows
            artifact_paths: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - os: macos-latest
            artifact_name: mova-flow-macos
            artifact_paths: |
              release/*.dmg
              release/*.dmg.blockmap
              release/latest-mac.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Import App Store Connect API key (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p private_keys
          echo "${APPLE_API_KEY_B64}" | base64 --decode > "private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}

      - name: Build installer
        run: npm run dist
        env:
          # Developer ID Application certificate (base64 .p12) + notarization
          # via an App Store Connect API key. electron-builder signs and
          # notarizes automatically when these are set. Scoped to the macOS
          # matrix leg only — CSC_LINK is also read by electron-builder's
          # Windows signing path, and it holds a mac-only cert.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ matrix.os == 'macos-latest' && format('private_keys/AuthKey_{0}.p8', secrets.APPLE_API_KEY_ID) || '' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: warn

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/**/*
          generate_release_notes: true
