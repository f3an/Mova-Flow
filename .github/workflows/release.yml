name: Release

# The host role only runs on Windows (whisper-cli.exe, PowerShell Expand-Archive,
# nvidia-smi — see docs/ARCHITECTURE.md#platform-constraints); the macOS build is
# client-role only (UI + networking, no local recognition). GitHub also attaches
# an automatic "Source code (zip)" asset to every release — nothing to build for that.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: mova-flow-windows
            artifact_paths: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - os: macos-latest
            artifact_name: mova-flow-macos
            artifact_paths: |
              release/*.dmg
              release/*.dmg.blockmap
              release/*.zip
              release/*.zip.blockmap
              release/latest-mac.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Import App Store Connect API key (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p private_keys
          echo "${APPLE_API_KEY_B64}" | base64 --decode > "private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}

      - name: Import signing certificate (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$CSC_LINK" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          # -k here must be the keychain's own unlock password (KEYCHAIN_PASSWORD),
          # not the .p12 export password — electron-builder's own built-in keychain
          # setup gets this wrong on newer macOS runners and fails with
          # "SecKeychainUnlock: ... not correct", so we set the keychain up
          # ourselves and let electron-builder auto-discover the identity instead.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build installer
        run: npm run dist
        env:
          # Signing identity comes from the keychain set up in the previous
          # step (auto-discovered); only notarization vars are needed here.
          APPLE_API_KEY: ${{ matrix.os == 'macos-latest' && format('private_keys/AuthKey_{0}.p8', secrets.APPLE_API_KEY_ID) || '' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: warn

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/**/*
          generate_release_notes: true
