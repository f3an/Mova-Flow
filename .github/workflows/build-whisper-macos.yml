name: Build whisper.cpp (macOS arm64)

# Unlike Windows, ggml-org/whisper.cpp does not publish a precompiled macOS
# binary in its releases (verified against several recent build tags — only
# Windows zips and an Ubuntu tar.gz ship). This workflow builds whisper-cli
# from source on an Apple Silicon runner and publishes it to GitHub Packages
# (GHCR) as a public OCI artifact — deliberately NOT a GitHub Release: this
# repo's Releases page is tag-only (app versions), and this artifact tracks
# an upstream whisper.cpp build tag on its own cadence, not ours. engine.ts
# pulls it back via the anonymous OCI registry flow (see src/main/ghcr.ts).
# Run manually (workflow_dispatch) whenever WHISPER_CPP_TAG in engine.ts is
# bumped.
#
# One-time manual step after this runs for the very first time: GHCR
# packages default to Private even when pushed from a public repo. Go to
# https://github.com/users/f3an/packages/container/whisper-cli-macos-arm64/settings
# and set visibility to Public — otherwise the anonymous pull token request
# in ghcr.ts fails and no end user can download the binary.
on:
  workflow_dispatch:
    inputs:
      whisper_tag:
        description: 'whisper.cpp build tag to compile (must match WHISPER_CPP_TAG in engine.ts)'
        required: true
        default: 'b5130'

permissions:
  packages: write

jobs:
  build:
    name: Build whisper-cli for macOS (Apple Silicon)
    runs-on: macos-14

    steps:
      - name: Checkout whisper.cpp
        uses: actions/checkout@v7
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ inputs.whisper_tag }}
          path: whisper.cpp

      - name: Configure (static binary, Metal embedded)
        run: |
          cmake -B build -S whisper.cpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL_EMBED_LIBRARY=ON

      - name: Build whisper-cli
        run: cmake --build build --target whisper-cli --config Release -j

      - name: Verify binary runs
        run: |
          file build/bin/whisper-cli
          build/bin/whisper-cli --help | head -5

      - name: Package
        run: |
          mkdir -p dist/bin
          cp build/bin/whisper-cli dist/bin/whisper-cli
          chmod +x dist/bin/whisper-cli
          cd dist && zip -r ../whisper-cpp-macos-arm64.zip bin

      - name: Set up oras
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push as an OCI artifact to GitHub Packages
        run: |
          oras push ghcr.io/f3an/whisper-cli-macos-arm64:${{ inputs.whisper_tag }} \
            --artifact-type application/vnd.mova-flow.whisper-cli.v1 \
            --annotation "org.opencontainers.image.description=Prebuilt whisper-cli for Apple Silicon Macs, compiled from ggml-org/whisper.cpp@${{ inputs.whisper_tag }}. Static binary, Metal-accelerated. Downloaded automatically by Mova Flow's host role on macOS." \
            --annotation "org.opencontainers.image.source=https://github.com/f3an/Mova-Flow" \
            whisper-cpp-macos-arm64.zip:application/zip
