name: Build whisper.cpp (macOS arm64)

# Unlike Windows, ggml-org/whisper.cpp does not publish a precompiled macOS
# binary in its releases (verified against several recent build tags — only
# Windows zips and an Ubuntu tar.gz ship). This workflow builds whisper-cli
# from source on an Apple Silicon runner and publishes it as a release asset
# in *this* repo, so engine.ts can download it the same way it already does
# for Windows. Run manually (workflow_dispatch) whenever WHISPER_CPP_TAG in
# src/main/engine.ts is bumped.
on:
  workflow_dispatch:
    inputs:
      whisper_tag:
        description: 'whisper.cpp build tag to compile (must match WHISPER_CPP_TAG in engine.ts)'
        required: true
        default: 'b5130'

permissions:
  contents: write

jobs:
  build:
    name: Build whisper-cli for macOS (Apple Silicon)
    runs-on: macos-14

    steps:
      - name: Checkout whisper.cpp
        uses: actions/checkout@v7
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ inputs.whisper_tag }}
          path: whisper.cpp

      - name: Configure (static binary, Metal embedded)
        run: |
          cmake -B build -S whisper.cpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL_EMBED_LIBRARY=ON

      - name: Build whisper-cli
        run: cmake --build build --target whisper-cli --config Release -j

      - name: Verify binary runs
        run: |
          file build/bin/whisper-cli
          build/bin/whisper-cli --help | head -5

      - name: Package
        run: |
          mkdir -p dist/bin
          cp build/bin/whisper-cli dist/bin/whisper-cli
          chmod +x dist/bin/whisper-cli
          cd dist && zip -r ../whisper-cpp-macos-arm64.zip bin

      - name: Publish as a release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: whisper-cpp-macos-arm64-${{ inputs.whisper_tag }}
          name: 'whisper.cpp ${{ inputs.whisper_tag }} — macOS arm64'
          body: |
            Prebuilt `whisper-cli` for Apple Silicon Macs, compiled from
            [ggml-org/whisper.cpp@${{ inputs.whisper_tag }}](https://github.com/ggml-org/whisper.cpp/tree/${{ inputs.whisper_tag }}).
            Static binary, Metal-accelerated, no external runtime dependencies.
            Downloaded automatically by Mova Flow's host role on macOS — not
            meant to be installed manually.
          files: whisper-cpp-macos-arm64.zip
