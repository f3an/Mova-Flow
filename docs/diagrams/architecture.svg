<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" role="img" aria-label="Mova Flow process architecture: renderer talks to the main process over IPC through the preload bridge; the main process holds config, runs the Express HTTP API, and drives the whisper.cpp engine; each of those three persists to its own external counterpart on disk, on the network, or as a child process.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c4235"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8461f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="660" fill="#f7f5ee"/>

  <!-- Renderer -->
  <rect x="40" y="40" width="900" height="80" rx="8" fill="#ffffff" stroke="#2c4235" stroke-width="2"/>
  <text x="490" y="68" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2e23">Renderer process (Chromium, sandboxed — nodeIntegration: false)</text>
  <text x="490" y="92" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5a50">index.html + renderer.ts — Upload / History / Server tabs · i18n.ts (en default, uk overlay)</text>

  <!-- IPC arrow renderer <-> preload -->
  <line x1="490" y1="120" x2="490" y2="150" stroke="#2c4235" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="510" y="139" font-family="sans-serif" font-size="11" fill="#4b5a50">window.api.*() → ipcRenderer.invoke(channel, …)</text>

  <!-- Preload -->
  <rect x="40" y="150" width="900" height="50" rx="8" fill="#e9e7dc" stroke="#2c4235" stroke-width="2"/>
  <text x="490" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1c2e23">preload/index.ts — contextBridge.exposeInMainWorld('api', …) and ('platform', …)</text>

  <line x1="490" y1="200" x2="490" y2="230" stroke="#2c4235" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="510" y="219" font-family="sans-serif" font-size="11" fill="#4b5a50">ipcMain.handle(channel, …)</text>

  <!-- Main process container -->
  <rect x="40" y="230" width="900" height="190" rx="8" fill="none" stroke="#2c4235" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="252" font-family="sans-serif" font-size="12" font-weight="700" fill="#1c2e23">Main process (Node.js) — main/index.ts</text>

  <!-- C1 Config -->
  <rect x="70" y="265" width="260" height="120" rx="6" fill="#ffffff" stroke="#2c4235" stroke-width="1.5"/>
  <text x="200" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1c2e23">Config</text>
  <text x="200" y="304" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">readConfig() / writeConfig()</text>
  <text x="200" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">role, port, auth_secret,</text>
  <text x="200" y="336" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">model choice, lan_expose</text>
  <text x="200" y="358" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a8a7a">userData/config.json</text>

  <!-- C2 HTTP -->
  <rect x="360" y="265" width="260" height="120" rx="6" fill="#ffffff" stroke="#2c4235" stroke-width="1.5"/>
  <text x="490" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1c2e23">HTTP API</text>
  <text x="490" y="304" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">server.ts — Express + ServerController</text>
  <text x="490" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">/api/auth /api/transcribe</text>
  <text x="490" y="336" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">/api/status /api/history…</text>
  <text x="490" y="358" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a8a7a">rateLimiter · requireAuth · requireLocal</text>

  <!-- arrow C2 -> C3 -->
  <line x1="622" y1="325" x2="648" y2="325" stroke="#2c4235" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="635" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4b5a50">calls</text>

  <!-- C3 Engine -->
  <rect x="650" y="265" width="260" height="120" rx="6" fill="#ffffff" stroke="#2c4235" stroke-width="1.5"/>
  <text x="780" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1c2e23">Recognition engine</text>
  <text x="780" y="304" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">engine.ts</text>
  <text x="780" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">ensureEngine() downloads</text>
  <text x="780" y="336" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">whisper.cpp + ggml model</text>
  <text x="780" y="358" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a8a7a">transcribe() spawns the CLI</text>

  <!-- C1 -> D1 -->
  <line x1="200" y1="385" x2="200" y2="490" stroke="#2c4235" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <!-- C2 -> D2 -->
  <line x1="490" y1="385" x2="490" y2="490" stroke="#2c4235" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- C3 -> D3 -->
  <line x1="760" y1="385" x2="760" y2="490" stroke="#a8461f" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <line x1="800" y1="490" x2="800" y2="385" stroke="#a8461f" stroke-width="2" marker-end="url(#arrowAccent)"/>

  <text x="215" y="440" font-family="sans-serif" font-size="10" fill="#4b5a50">reads / writes</text>
  <text x="505" y="440" font-family="sans-serif" font-size="10" fill="#4b5a50">serves :{port}</text>
  <text x="812" y="425" font-family="sans-serif" font-size="10" fill="#a8461f">spawn(-m,-f,-l)</text>
  <text x="812" y="460" font-family="sans-serif" font-size="10" fill="#a8461f">stdout: segments</text>

  <!-- D1 Filesystem -->
  <rect x="70" y="490" width="260" height="100" rx="6" fill="#ffffff" stroke="#2c4235" stroke-width="1.5"/>
  <text x="200" y="511" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1c2e23">userData directory</text>
  <text x="200" y="529" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">config.json · history.json</text>
  <text x="200" y="545" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">engine/ (CLI + model .bin)</text>
  <text x="200" y="561" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">uploads/ · transcripts/ · audio/</text>

  <!-- D2 Network -->
  <rect x="360" y="490" width="260" height="100" rx="6" fill="#ffffff" stroke="#2c4235" stroke-width="1.5"/>
  <text x="490" y="511" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1c2e23">Network</text>
  <text x="490" y="529" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">this machine's own Upload tab</text>
  <text x="490" y="545" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">(always loopback) +</text>
  <text x="490" y="561" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">other LAN devices, if exposed</text>

  <!-- D3 whisper-cli -->
  <rect x="650" y="490" width="260" height="100" rx="6" fill="#fbeee7" stroke="#a8461f" stroke-width="1.5"/>
  <text x="780" y="511" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1c2e23">whisper-cli.exe</text>
  <text x="780" y="529" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">child process (whisper.cpp)</text>
  <text x="780" y="545" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">reads the ggml-*.bin model</text>
  <text x="780" y="561" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">prints timestamped segments</text>

  <text x="490" y="625" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a7a">Windows-only host role: whisper-cli.exe, PowerShell Expand-Archive, and nvidia-smi are all Windows APIs — a client-role install runs anywhere Electron does.</text>
</svg>
