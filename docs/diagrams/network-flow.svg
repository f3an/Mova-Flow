<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" role="img" aria-label="Sequence of a client transcribing a file through a host on the LAN: exchange the pre-shared secret for a short-lived bearer token, upload the file under that token, poll job status every 1.5 seconds, then download the finished transcript. History endpoints stay loopback-only on the host regardless of the token.">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c4235"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="800" fill="#f7f5ee"/>

  <!-- Lifeline headers -->
  <rect x="70" y="24" width="220" height="54" rx="8" fill="#ffffff" stroke="#2c4235" stroke-width="2"/>
  <text x="180" y="46" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1c2e23">Client machine</text>
  <text x="180" y="64" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">role: client — Mova Flow UI only</text>

  <rect x="610" y="24" width="220" height="54" rx="8" fill="#ffffff" stroke="#2c4235" stroke-width="2"/>
  <text x="720" y="46" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1c2e23">Host machine</text>
  <text x="720" y="64" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5a50">role: host — server.ts on :5000</text>

  <line x1="180" y1="78" x2="180" y2="770" stroke="#2c4235" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="720" y1="78" x2="720" y2="770" stroke="#2c4235" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 1 auth request -->
  <line x1="180" y1="110" x2="712" y2="110" stroke="#2c4235" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <text x="190" y="102" font-family="sans-serif" font-size="12" fill="#1c2e23">① POST /api/auth  { secret }</text>
  <text x="190" y="122" font-family="sans-serif" font-size="10" fill="#8a8a7a">secret copied once from the host's Server tab → Access secret key</text>

  <!-- 2 auth response -->
  <line x1="712" y1="160" x2="188" y2="160" stroke="#2c4235" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow2)"/>
  <text x="710" y="152" text-anchor="end" font-family="sans-serif" font-size="12" fill="#1c2e23">② 200  { token, expiresAt }</text>
  <text x="710" y="172" text-anchor="end" font-family="sans-serif" font-size="10" fill="#8a8a7a">HS256 token, timingSafeEqual check, 12h TTL</text>

  <!-- 3 transcribe request -->
  <line x1="180" y1="212" x2="712" y2="212" stroke="#2c4235" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <text x="190" y="204" font-family="sans-serif" font-size="12" fill="#1c2e23">③ POST /api/transcribe</text>
  <text x="190" y="224" font-family="sans-serif" font-size="10" fill="#8a8a7a">Authorization: Bearer &lt;token&gt;, multipart audio file</text>

  <!-- self box on host: processing -->
  <rect x="720" y="248" width="150" height="72" rx="6" fill="#fbeee7" stroke="#a8461f" stroke-width="1.5"/>
  <line x1="720" y1="255" x2="712" y2="255" stroke="#2c4235" stroke-width="1.5"/>
  <line x1="712" y1="255" x2="712" y2="300" stroke="#2c4235" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="730" y="266" font-family="sans-serif" font-size="10.5" fill="#1c2e23">④ rateLimiter →</text>
  <text x="730" y="281" font-family="sans-serif" font-size="10.5" fill="#1c2e23">requireAuth → multer</text>
  <text x="730" y="296" font-family="sans-serif" font-size="10.5" fill="#1c2e23">saves to uploads/, then</text>
  <text x="730" y="311" font-family="sans-serif" font-size="10.5" fill="#1c2e23">spawns whisper-cli.exe</text>

  <!-- 5 job id response -->
  <line x1="712" y1="345" x2="188" y2="345" stroke="#2c4235" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow2)"/>
  <text x="710" y="337" text-anchor="end" font-family="sans-serif" font-size="12" fill="#1c2e23">⑤ 200  { job_id }</text>

  <!-- polling loop box -->
  <rect x="150" y="375" width="600" height="120" rx="6" fill="none" stroke="#2c4235" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="160" y="392" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#4b5a50">loop — every 1.5s until status is "done" or "error"</text>

  <line x1="180" y1="420" x2="712" y2="420" stroke="#2c4235" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="190" y="412" font-family="sans-serif" font-size="11.5" fill="#1c2e23">⑥ GET /api/status/:job_id</text>

  <line x1="712" y1="462" x2="188" y2="462" stroke="#2c4235" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow2)"/>
  <text x="710" y="454" text-anchor="end" font-family="sans-serif" font-size="11.5" fill="#1c2e23">{ status: "processing", progress } → … → { status: "done", result }</text>

  <!-- 7 download -->
  <line x1="180" y1="530" x2="712" y2="530" stroke="#2c4235" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <text x="190" y="522" font-family="sans-serif" font-size="12" fill="#1c2e23">⑦ GET /api/download/:job_id</text>

  <line x1="712" y1="572" x2="188" y2="572" stroke="#2c4235" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow2)"/>
  <text x="710" y="564" text-anchor="end" font-family="sans-serif" font-size="12" fill="#1c2e23">⑧ 200  transcript_&lt;id&gt;.txt</text>

  <!-- Loopback-only note -->
  <rect x="470" y="620" width="360" height="120" rx="8" fill="#fbeee7" stroke="#a8461f" stroke-width="1.5"/>
  <text x="490" y="644" font-family="sans-serif" font-size="12" font-weight="700" fill="#a8461f">requireLocal — /api/history*</text>
  <text x="490" y="664" font-family="sans-serif" font-size="11" fill="#1c2e23">Any request whose IP isn't 127.0.0.1</text>
  <text x="490" y="681" font-family="sans-serif" font-size="11" fill="#1c2e23">gets 403 here, even with a valid token —</text>
  <text x="490" y="698" font-family="sans-serif" font-size="11" fill="#1c2e23">so this client's own sent/received jobs</text>
  <text x="490" y="715" font-family="sans-serif" font-size="11" fill="#1c2e23">live only on its own machine (clientHistory.ts).</text>

  <text x="450" y="775" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a8a7a">All requests carry CORS + preflight headers (renderer loads from file://, so every fetch() is cross-origin).</text>
</svg>
